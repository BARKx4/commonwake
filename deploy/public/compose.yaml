name: commonwake-public

services:
  commonwake:
    image: ${COMMONWAKE_IMAGE:-ghcr.io/barkx4/commonwake:main}
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 20s
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      COMMONWAKE_DATA_DIR: /data
      COMMONWAKE_BIND: 127.0.0.1:8787
      COMMONWAKE_TLS_DOMAIN: ${COMMONWAKE_TLS_DOMAIN:?set COMMONWAKE_TLS_DOMAIN}
      COMMONWAKE_TLS_BIND: 0.0.0.0:8443
      COMMONWAKE_ACME_HTTP_BIND: 0.0.0.0:8080
      COMMONWAKE_ACME_CONTACT_EMAIL: ${COMMONWAKE_ACME_CONTACT_EMAIL:-}
      COMMONWAKE_ACME_PRODUCTION: ${COMMONWAKE_ACME_PRODUCTION:-false}
      COMMONWAKE_PUBLIC_WRITE_TOKEN: ${COMMONWAKE_PUBLIC_WRITE_TOKEN:-}
      COMMONWAKE_PUBLIC_ALLOWED_PUBLISHERS: ${COMMONWAKE_PUBLIC_ALLOWED_PUBLISHERS:-}
      COMMONWAKE_PUBLIC_REQUESTS_PER_SECOND: ${COMMONWAKE_PUBLIC_REQUESTS_PER_SECOND:-100}
      COMMONWAKE_PUBLIC_WRITES_PER_MINUTE: ${COMMONWAKE_PUBLIC_WRITES_PER_MINUTE:-60}
      COMMONWAKE_PUBLIC_MAX_CONCURRENCY: ${COMMONWAKE_PUBLIC_MAX_CONCURRENCY:-64}
      COMMONWAKE_PUBLIC_MAX_FEDERATION_CONCURRENCY: ${COMMONWAKE_PUBLIC_MAX_FEDERATION_CONCURRENCY:-2}
      COMMONWAKE_PUBLIC_MAX_STORAGE_BYTES: ${COMMONWAKE_PUBLIC_MAX_STORAGE_BYTES:-21474836480}
      COMMONWAKE_PUBLIC_MAX_ORIGINS: ${COMMONWAKE_PUBLIC_MAX_ORIGINS:-256}
      COMMONWAKE_PUBLIC_MAX_ORIGIN_EVENTS: ${COMMONWAKE_PUBLIC_MAX_ORIGIN_EVENTS:-25000}
      COMMONWAKE_INGEST_INTERVAL_SECONDS: ${COMMONWAKE_INGEST_INTERVAL_SECONDS:-900}
      COMMONWAKE_SYNC_INTERVAL_SECONDS: ${COMMONWAKE_SYNC_INTERVAL_SECONDS:-300}
      COMMONWAKE_PUBLISH_INTERVAL_SECONDS: ${COMMONWAKE_PUBLISH_INTERVAL_SECONDS:-60}
      COMMONWAKE_VERIFY_INTERVAL_SECONDS: ${COMMONWAKE_VERIFY_INTERVAL_SECONDS:-3600}
      COMMONWAKE_PEERS: ${COMMONWAKE_PEERS:-}
      COMMONWAKE_PUBLISHERS: ${COMMONWAKE_PUBLISHERS:-}
      COMMONWAKE_DESIRED_REPLICAS: ${COMMONWAKE_DESIRED_REPLICAS:-2}
    volumes:
      - commonwake-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  commonwake-data:
